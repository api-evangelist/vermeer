name: Vermeer
description: 'Vermeer is an American-Ukrainian defense-technology startup (founded 2018 by Brian Streem;
  headquartered in New York with forward operations in Kyiv) building vision-based autonomy for unmanned
  aerial platforms. Its Visual Positioning System (VPS) uses electro-optical and infrared cameras plus
  onboard AI (NVIDIA) to match imagery to 2D/3D maps and deliver precise navigation in GPS-denied,
  jammed, or spoofed environments. Products include Air (absolute positioning without GPS), Celestial
  (star-based navigation), and Terminal Guidance (precision targeting). The technology has been fielded
  by the Armed Forces of Ukraine and is aimed at defense customers including Lockheed Martin, General
  Atomics, Northrop Grumman, and the U.S. Air Force and Army. Vermeer exposes no public API, SDK, or
  developer platform at this time; this profile is a company/marketing surface with no API artifacts.'
